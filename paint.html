<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paint</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#toolbar {
    height: 50px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    background: #ececec;
    border-bottom: 1px solid #bbb;
}

button {
    padding: 6px 12px;
    cursor: pointer;
}

.active {
    background: #bcdcff;
}

canvas {
    display: block;
    background: white;
    cursor: crosshair;
    touch-action: none;
}
</style>
</head>
<body>

<div id="toolbar">
    <button id="pencilBtn" class="active">Pencil</button>
    <button id="eraserBtn">Eraser</button>

    <input type="color" id="color" value="#000000">

    <label>Size:</label>
    <input type="range" id="size" min="1" max="50" value="3">

    <button id="clearBtn">Clear</button>
    <button id="saveBtn">Save PNG</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const toolbar = document.getElementById("toolbar");
const colorInput = document.getElementById("color");
const sizeInput = document.getElementById("size");

let drawing = false;
let tool = "pencil";

function resizeCanvas() {
    const image = document.createElement("canvas");
    image.width = canvas.width;
    image.height = canvas.height;

    const imageCtx = image.getContext("2d");
    imageCtx.drawImage(canvas, 0, 0);

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - toolbar.offsetHeight;

    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.drawImage(image, 0, 0);
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

document.getElementById("pencilBtn").addEventListener("click", () => {
    tool = "pencil";
    document.getElementById("pencilBtn").classList.add("active");
    document.getElementById("eraserBtn").classList.remove("active");
});

document.getElementById("eraserBtn").addEventListener("click", () => {
    tool = "eraser";
    document.getElementById("eraserBtn").classList.add("active");
    document.getElementById("pencilBtn").classList.remove("active");
});

function getMousePos(event) {
    const rect = canvas.getBoundingClientRect();

    return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
    };
}

canvas.addEventListener("pointerdown", (event) => {
    drawing = true;

    const pos = getMousePos(event);

    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);

    canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener("pointermove", (event) => {
    if (!drawing) return;

    const pos = getMousePos(event);

    ctx.lineWidth = parseInt(sizeInput.value);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    if (tool === "eraser") {
        ctx.strokeStyle = "#FFFFFF";
    } else {
        ctx.strokeStyle = colorInput.value;
    }

    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
});

canvas.addEventListener("pointerup", () => {
    drawing = false;
});

canvas.addEventListener("pointercancel", () => {
    drawing = false;
});

canvas.addEventListener("pointerleave", () => {
    drawing = false;
});

document.getElementById("clearBtn").addEventListener("click", () => {
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
});

document.getElementById("saveBtn").addEventListener("click", () => {
    const link = document.createElement("a");
    link.download = "drawing.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
});
</script>

</body>
</html>
