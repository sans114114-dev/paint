<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paint</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f0f0f0}
.screen{display:none;width:100vw;height:100vh}
.screen.active{display:flex}
#homeScreen{
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:20px;
}
#galleryScreen{
    flex-direction:column;
}
#galleryGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:15px;
    padding:15px;
    overflow:auto;
}
.galleryItem{
    background:white;
    border:1px solid #ccc;
    padding:10px;
}
.galleryItem img{
    width:100%;
    display:block;
    border:1px solid #aaa;
}
.galleryItem button{
    margin-top:8px;
    width:100%;
}
#paintScreen{
    flex-direction:column;
}
#toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding:8px;
    background:#ececec;
    border-bottom:1px solid #bbb;
}
button{
    padding:6px 12px;
    cursor:pointer;
}
.activeTool{
    background:#bcdcff;
}
canvas{
    display:block;
    background:white;
    flex:1;
    touch-action:none;
}
h1{
    margin:0 0 20px 0;
}
.homeBtn{
    font-size:20px;
    padding:15px 30px;
}
</style>
</head>
<body>

<div id="homeScreen" class="screen active">
    <h1>Paint</h1>
    <button class="homeBtn" id="newCanvasBtn">New Canvas</button>
    <button class="homeBtn" id="galleryBtn">My Gallery</button>
</div>

<div id="galleryScreen" class="screen">
    <div id="toolbar">
        <button id="galleryBackBtn">Back</button>
    </div>
    <div id="galleryGrid"></div>
</div>

<div id="paintScreen" class="screen">
    <div id="toolbar">
        <button id="homeBtn">Home</button>

        <button id="pencilBtn" class="activeTool">Pencil</button>
        <button id="eraserBtn">Eraser</button>
        <button id="fillBtn">Fill</button>

        <button id="rectStampBtn">Rectangle</button>
        <button id="circleStampBtn">Circle</button>
        <button id="triangleStampBtn">Triangle</button>

        <button id="undoBtn">Undo</button>
        <button id="redoBtn">Redo</button>

        <input type="color" id="color" value="#000000">

        <label>Size:</label>
        <input type="range" id="size" min="1" max="50" value="3">

        <button id="saveGalleryBtn">Save To Gallery</button>
        <button id="clearBtn">Clear</button>
        <button id="saveBtn">Save PNG</button>
    </div>

    <canvas id="canvas"></canvas>
</div>

<script>
const homeScreen = document.getElementById("homeScreen");
const galleryScreen = document.getElementById("galleryScreen");
const paintScreen = document.getElementById("paintScreen");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const colorInput = document.getElementById("color");
const sizeInput = document.getElementById("size");

let drawing = false;
let tool = "pencil";

const undoStack = [];
const redoStack = [];
const MAX_HISTORY = 50;

function showScreen(screen){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    screen.classList.add("active");

    if(screen === paintScreen){
        resizeCanvas();
    }
}

function getGallery(){
    return JSON.parse(localStorage.getItem("paintGallery") || "[]");
}

function saveGallery(data){
    localStorage.setItem("paintGallery", JSON.stringify(data));
}

function renderGallery(){
    const galleryGrid = document.getElementById("galleryGrid");
    galleryGrid.innerHTML = "";

    const gallery = getGallery();

    gallery.reverse().forEach((item,index)=>{
        const div = document.createElement("div");
        div.className = "galleryItem";

        const img = document.createElement("img");
        img.src = item.image;

        const title = document.createElement("div");
        title.textContent = item.name;

        const openBtn = document.createElement("button");
        openBtn.textContent = "Open";

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";

        openBtn.onclick = ()=>{
            showScreen(paintScreen);

            const image = new Image();
            image.onload = ()=>{
                ctx.fillStyle = "white";
                ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.drawImage(image,0,0);
                saveState();
            };
            image.src = item.image;
        };

        deleteBtn.onclick = ()=>{
            const all = getGallery();
            all.splice(all.length - 1 - index,1);
            saveGallery(all);
            renderGallery();
        };

        div.appendChild(img);
        div.appendChild(title);
        div.appendChild(openBtn);
        div.appendChild(deleteBtn);

        galleryGrid.appendChild(div);
    });
}

document.getElementById("newCanvasBtn").onclick = ()=>{
    showScreen(paintScreen);

    ctx.fillStyle = "white";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    undoStack.length = 0;
    redoStack.length = 0;
    saveState();
};

document.getElementById("galleryBtn").onclick = ()=>{
    renderGallery();
    showScreen(galleryScreen);
};

document.getElementById("galleryBackBtn").onclick = ()=>{
    showScreen(homeScreen);
};

document.getElementById("homeBtn").onclick = ()=>{
    showScreen(homeScreen);
};

function resizeCanvas(){
    if(!paintScreen.classList.contains("active")) return;

    const image = document.createElement("canvas");
    image.width = canvas.width || 1;
    image.height = canvas.height || 1;

    image.getContext("2d").drawImage(canvas,0,0);

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - document.querySelector("#paintScreen #toolbar").offsetHeight;

    ctx.fillStyle = "white";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.drawImage(image,0,0);
}

window.addEventListener("resize", resizeCanvas);

function saveState(){
    redoStack.length = 0;

    undoStack.push(canvas.toDataURL());

    if(undoStack.length > MAX_HISTORY){
        undoStack.shift();
    }
}

function restoreState(data){
    const img = new Image();

    img.onload = ()=>{
        ctx.fillStyle = "white";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0);
    };

    img.src = data;
}

function setTool(newTool, button){
    tool = newTool;

    document.querySelectorAll("#paintScreen button").forEach(btn=>{
        btn.classList.remove("activeTool");
    });

    button.classList.add("activeTool");
}

pencilBtn.onclick = ()=>setTool("pencil", pencilBtn);
eraserBtn.onclick = ()=>setTool("eraser", eraserBtn);
fillBtn.onclick = ()=>setTool("fill", fillBtn);
rectStampBtn.onclick = ()=>setTool("rectangle", rectStampBtn);
circleStampBtn.onclick = ()=>setTool("circle", circleStampBtn);
triangleStampBtn.onclick = ()=>setTool("triangle", triangleStampBtn);

function getMousePos(event){
    const rect = canvas.getBoundingClientRect();

    return {
        x: Math.floor(event.clientX - rect.left),
        y: Math.floor(event.clientY - rect.top)
    };
}

function hexToRgb(hex){
    return {
        r: parseInt(hex.slice(1,3),16),
        g: parseInt(hex.slice(3,5),16),
        b: parseInt(hex.slice(5,7),16)
    };
}

function floodFill(x,y,color){
    const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
    const data = imageData.data;

    const start = (y * canvas.width + x) * 4;

    const tr = data[start];
    const tg = data[start+1];
    const tb = data[start+2];
    const ta = data[start+3];

    const stack = [[x,y]];

    while(stack.length){
        const [cx,cy] = stack.pop();

        if(cx<0||cy<0||cx>=canvas.width||cy>=canvas.height) continue;

        const pos = (cy * canvas.width + cx) * 4;

        if(
            data[pos]!==tr||
            data[pos+1]!==tg||
            data[pos+2]!==tb||
            data[pos+3]!==ta
        ) continue;

        data[pos]=color.r;
        data[pos+1]=color.g;
        data[pos+2]=color.b;
        data[pos+3]=255;

        stack.push([cx+1,cy]);
        stack.push([cx-1,cy]);
        stack.push([cx,cy+1]);
        stack.push([cx,cy-1]);
    }

    ctx.putImageData(imageData,0,0);
}

canvas.addEventListener("pointerdown",(event)=>{
    const pos = getMousePos(event);
    const shapeSize = parseInt(sizeInput.value) * 10;

    if(tool==="fill"){
        saveState();
        floodFill(pos.x,pos.y,hexToRgb(colorInput.value));
        return;
    }

    if(tool==="rectangle"){
        saveState();
        ctx.fillStyle = colorInput.value;
        ctx.fillRect(pos.x-shapeSize/2,pos.y-shapeSize/2,shapeSize,shapeSize);
        return;
    }

    if(tool==="circle"){
        saveState();
        ctx.fillStyle = colorInput.value;
        ctx.beginPath();
        ctx.arc(pos.x,pos.y,shapeSize/2,0,Math.PI*2);
        ctx.fill();
        return;
    }

    if(tool==="triangle"){
        saveState();
        ctx.fillStyle = colorInput.value;
        ctx.beginPath();
        ctx.moveTo(pos.x,pos.y-shapeSize/2);
        ctx.lineTo(pos.x-shapeSize/2,pos.y+shapeSize/2);
        ctx.lineTo(pos.x+shapeSize/2,pos.y+shapeSize/2);
        ctx.closePath();
        ctx.fill();
        return;
    }

    saveState();

    drawing = true;

    ctx.beginPath();
    ctx.moveTo(pos.x,pos.y);

    canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener("pointermove",(event)=>{
    if(!drawing) return;

    const pos = getMousePos(event);

    ctx.lineWidth = parseInt(sizeInput.value);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.strokeStyle = tool==="eraser" ? "#FFFFFF" : colorInput.value;

    ctx.lineTo(pos.x,pos.y);
    ctx.stroke();
});

canvas.addEventListener("pointerup",()=>drawing=false);
canvas.addEventListener("pointerleave",()=>drawing=false);
canvas.addEventListener("pointercancel",()=>drawing=false);

undoBtn.onclick = ()=>{
    if(undoStack.length <= 1) return;

    redoStack.push(undoStack.pop());
    restoreState(undoStack[undoStack.length-1]);
};

redoBtn.onclick = ()=>{
    if(!redoStack.length) return;

    const state = redoStack.pop();
    undoStack.push(state);
    restoreState(state);
};

clearBtn.onclick = ()=>{
    saveState();
    ctx.fillStyle = "white";
    ctx.fillRect(0,0,canvas.width,canvas.height);
};

saveGalleryBtn.onclick = ()=>{
    const name = prompt("Drawing name:","My Drawing");
    if(name === null) return;

    const gallery = getGallery();

    gallery.push({
        name: name || "My Drawing",
        image: canvas.toDataURL("image/png")
    });

    saveGallery(gallery);
};

saveBtn.onclick = ()=>{
    let fileName = prompt("Enter a file name:","drawing");

    if(fileName===null) return;

    fileName = fileName.trim() || "drawing";

    const link = document.createElement("a");
    link.download = fileName + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
};
</script>

</body>
</html>
