<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paint</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
    overflow:hidden;
    background:#111;
}

.screen{
    display:none;
    width:100vw;
    height:100vh;
}

.screen.active{
    display:flex;
}

#homeScreen{
    position:relative;
    overflow:hidden;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top left,#6aa9ff,transparent 40%),
    radial-gradient(circle at bottom right,#9f6aff,transparent 40%),
    linear-gradient(135deg,#1e293b,#0f172a);
}

.homeCard{
    width:min(90vw,650px);
    padding:40px;
    border-radius:24px;
    background:rgba(255,255,255,.1);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.15);
    text-align:center;
}

.homeTitle{
    font-size:72px;
    color:white;
    font-weight:900;
}

.homeSubtitle{
    color:#dbeafe;
    margin:15px 0 25px;
}

.homeBtn{
    width:100%;
    padding:16px;
    margin-top:12px;
    font-size:20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
}

#themeGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:20px;
}

.themeBtn{
    height:50px;
    border:none;
    border-radius:12px;
    cursor:pointer;
}

#galleryScreen{
    flex-direction:column;
    background:#f0f0f0;
}

#galleryGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:15px;
    padding:15px;
    overflow:auto;
}

.galleryItem{
    background:white;
    border:1px solid #ccc;
    padding:10px;
}

.galleryItem img{
    width:100%;
}

#paintScreen{
    flex-direction:column;
}

#toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:8px;
    background:#ececec;
    border-bottom:1px solid #bbb;
    position:relative;
}

#settingsPanel{
    display:none;
    position:absolute;
    top:55px;
    left:8px;
    background:white;
    border:1px solid #999;
    padding:10px;
    border-radius:10px;
    z-index:1000;
    min-width:220px;
}

button{
    cursor:pointer;
}

.activeTool{
    background:#bcdcff;
}

canvas{
    flex:1;
    display:block;
    background:white;
    touch-action:none;
}
</style>
</head>
<body>

<div id="homeScreen" class="screen active">
    <div class="homeCard">
        <div class="homeTitle">PAINT</div>
        <div class="homeSubtitle">Create, save and manage drawings</div>

        <button class="homeBtn" id="newCanvasBtn">🎨 New Canvas</button>
        <button class="homeBtn" id="galleryBtn">🖼 My Gallery</button>

        <div id="themeGrid">
            <button class="themeBtn" style="background:linear-gradient(135deg,#1e293b,#0f172a)"></button>
            <button class="themeBtn" style="background:linear-gradient(135deg,#0f766e,#164e63)"></button>
            <button class="themeBtn" style="background:linear-gradient(135deg,#7c3aed,#1d4ed8)"></button>
            <button class="themeBtn" style="background:linear-gradient(135deg,#b91c1c,#ea580c)"></button>
        </div>

        <button class="homeBtn" id="customThemeBtn">✨ Create Your Own Theme</button>
    </div>
</div>

<div id="galleryScreen" class="screen">
    <div id="toolbar">
        <button id="galleryBackBtn">Back</button>
    </div>
    <div id="galleryGrid"></div>
</div>

<div id="paintScreen" class="screen">
    <div id="toolbar">

        <button id="settingsBtn">⚙️</button>

        <div id="settingsPanel">
            <div>
                <strong>Background</strong>
            </div>
            <br>

            <input type="file" id="bgImageInput" accept="image/*">
            <br><br>

            <button id="drawBackgroundBtn">Draw Background</button>
            <button id="clearBackgroundBtn">Clear Background</button>
        </div>

        <button id="homeBtn">Home</button>

        <button id="pencilBtn" class="activeTool">Pencil</button>
        <button id="eraserBtn">Eraser</button>
        <button id="fillBtn">Fill</button>

        <button id="rectStampBtn">Rectangle</button>
        <button id="circleStampBtn">Circle</button>
        <button id="triangleStampBtn">Triangle</button>

        <button id="undoBtn">Undo</button>
        <button id="redoBtn">Redo</button>

        <input type="color" id="color" value="#000000">

        <label>Size</label>
        <input type="range" id="size" min="1" max="50" value="3">

        <button id="saveGalleryBtn">Save To Gallery</button>
        <button id="clearBtn">Clear</button>
        <button id="saveBtn">Save PNG</button>
    </div>

    <canvas id="canvas"></canvas>
</div>

<script>
const homeScreen=document.getElementById("homeScreen");
const galleryScreen=document.getElementById("galleryScreen");
const paintScreen=document.getElementById("paintScreen");

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const colorInput=document.getElementById("color");
const sizeInput=document.getElementById("size");

let tool="pencil";
let drawing=false;
let drawingBackground=false;

const undoStack=[];
const redoStack=[];

function showScreen(screen){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    screen.classList.add("active");
    if(screen===paintScreen) resizeCanvas();
}

function resizeCanvas(){
    if(!paintScreen.classList.contains("active")) return;

    const temp=document.createElement("canvas");
    temp.width=canvas.width||1;
    temp.height=canvas.height||1;

    temp.getContext("2d").drawImage(canvas,0,0);

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight-document.querySelector("#paintScreen #toolbar").offsetHeight;

    ctx.fillStyle="white";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(temp,0,0);
}

window.addEventListener("resize",resizeCanvas);

function saveState(){
    redoStack.length=0;
    undoStack.push(canvas.toDataURL());
    if(undoStack.length>50) undoStack.shift();
}

function restoreState(state){
    const img=new Image();

    img.onload=()=>{
        ctx.fillStyle="white";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0);
    };

    img.src=state;
}

function getMousePos(e){
    const rect=canvas.getBoundingClientRect();

    return {
        x:Math.floor(e.clientX-rect.left),
        y:Math.floor(e.clientY-rect.top)
    };
}

function setTool(name,button){
    tool=name;

    document.querySelectorAll("#paintScreen button").forEach(btn=>{
        btn.classList.remove("activeTool");
    });

    button.classList.add("activeTool");
}

function hexToRgb(hex){
    return{
        r:parseInt(hex.substr(1,2),16),
        g:parseInt(hex.substr(3,2),16),
        b:parseInt(hex.substr(5,2),16)
    };
}

function floodFill(x,y,color){
    const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
    const data=imageData.data;

    const start=(y*canvas.width+x)*4;

    const tr=data[start];
    const tg=data[start+1];
    const tb=data[start+2];
    const ta=data[start+3];

    const stack=[[x,y]];

    while(stack.length){
        const [cx,cy]=stack.pop();

        if(cx<0||cy<0||cx>=canvas.width||cy>=canvas.height) continue;

        const pos=(cy*canvas.width+cx)*4;

        if(
            data[pos]!==tr||
            data[pos+1]!==tg||
            data[pos+2]!==tb||
            data[pos+3]!==ta
        ) continue;

        data[pos]=color.r;
        data[pos+1]=color.g;
        data[pos+2]=color.b;
        data[pos+3]=255;

        stack.push([cx+1,cy]);
        stack.push([cx-1,cy]);
        stack.push([cx,cy+1]);
        stack.push([cx,cy-1]);
    }

    ctx.putImageData(imageData,0,0);
}

function getGallery(){
    return JSON.parse(localStorage.getItem("paintGallery")||"[]");
}

function saveGalleryData(data){
    localStorage.setItem("paintGallery",JSON.stringify(data));
}

function renderGallery(){
    const grid=document.getElementById("galleryGrid");
    grid.innerHTML="";

    const gallery=getGallery();

    gallery.forEach((item,index)=>{
        const card=document.createElement("div");
        card.className="galleryItem";

        card.innerHTML=`
        <img src="${item.image}">
        <p>${item.name}</p>
        <button>Open</button>
        <button>Delete</button>
        `;

        card.querySelectorAll("button")[0].onclick=()=>{
            showScreen(paintScreen);

            const img=new Image();

            img.onload=()=>{
                ctx.fillStyle="white";
                ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.drawImage(img,0,0,canvas.width,canvas.height);
                saveState();
            };

            img.src=item.image;
        };

        card.querySelectorAll("button")[1].onclick=()=>{
            const data=getGallery();
            data.splice(index,1);
            saveGalleryData(data);
            renderGallery();
        };

        grid.appendChild(card);
    });
}

newCanvasBtn.onclick=()=>{
    showScreen(paintScreen);

    ctx.fillStyle="white";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    undoStack.length=0;
    redoStack.length=0;

    saveState();
};

galleryBtn.onclick=()=>{
    renderGallery();
    showScreen(galleryScreen);
};

galleryBackBtn.onclick=()=>showScreen(homeScreen);
homeBtn.onclick=()=>showScreen(homeScreen);

pencilBtn.onclick=()=>setTool("pencil",pencilBtn);
eraserBtn.onclick=()=>setTool("eraser",eraserBtn);
fillBtn.onclick=()=>setTool("fill",fillBtn);
rectStampBtn.onclick=()=>setTool("rectangle",rectStampBtn);
circleStampBtn.onclick=()=>setTool("circle",circleStampBtn);
triangleStampBtn.onclick=()=>setTool("triangle",triangleStampBtn);

settingsBtn.onclick=()=>{
    settingsPanel.style.display=
    settingsPanel.style.display==="block"?"none":"block";
};

drawBackgroundBtn.onclick=()=>{
    drawingBackground=!drawingBackground;
    drawBackgroundBtn.textContent=
    drawingBackground?"Stop Drawing Background":"Draw Background";
};

clearBackgroundBtn.onclick=()=>{
    saveState();
    ctx.fillStyle="white";
    ctx.fillRect(0,0,canvas.width,canvas.height);
};

bgImageInput.onchange=(e)=>{
    const file=e.target.files[0];
    if(!file) return;

    const reader=new FileReader();

    reader.onload=(ev)=>{
        saveState();

        const img=new Image();

        img.onload=()=>{
            ctx.drawImage(img,0,0,canvas.width,canvas.height);
        };

        img.src=ev.target.result;
    };

    reader.readAsDataURL(file);
};

canvas.addEventListener("pointerdown",e=>{
    const pos=getMousePos(e);
    const shapeSize=parseInt(sizeInput.value)*10;

    if(drawingBackground){
        saveState();
        drawing=true;
        return;
    }

    if(tool==="fill"){
        saveState();
        floodFill(pos.x,pos.y,hexToRgb(colorInput.value));
        return;
    }

    if(tool==="rectangle"){
        saveState();
        ctx.fillStyle=colorInput.value;
        ctx.fillRect(pos.x-shapeSize/2,pos.y-shapeSize/2,shapeSize,shapeSize);
        return;
    }

    if(tool==="circle"){
        saveState();
        ctx.fillStyle=colorInput.value;
        ctx.beginPath();
        ctx.arc(pos.x,pos.y,shapeSize/2,0,Math.PI*2);
        ctx.fill();
        return;
    }

    if(tool==="triangle"){
        saveState();
        ctx.fillStyle=colorInput.value;
        ctx.beginPath();
        ctx.moveTo(pos.x,pos.y-shapeSize/2);
        ctx.lineTo(pos.x-shapeSize/2,pos.y+shapeSize/2);
        ctx.lineTo(pos.x+shapeSize/2,pos.y+shapeSize/2);
        ctx.closePath();
        ctx.fill();
        return;
    }

    saveState();
    drawing=true;
    ctx.beginPath();
    ctx.moveTo(pos.x,pos.y);
});

canvas.addEventListener("pointermove",e=>{
    if(!drawing) return;

    const pos=getMousePos(e);

    if(drawingBackground){
        ctx.fillStyle=colorInput.value;
        ctx.beginPath();
        ctx.arc(pos.x,pos.y,parseInt(sizeInput.value)*5,0,Math.PI*2);
        ctx.fill();
        return;
    }

    ctx.lineWidth=parseInt(sizeInput.value);
    ctx.lineCap="round";
    ctx.lineJoin="round";

    ctx.strokeStyle=
    tool==="eraser"?"#FFFFFF":colorInput.value;

    ctx.lineTo(pos.x,pos.y);
    ctx.stroke();
});

canvas.addEventListener("pointerup",()=>drawing=false);
canvas.addEventListener("pointerleave",()=>drawing=false);
canvas.addEventListener("pointercancel",()=>drawing=false);

undoBtn.onclick=()=>{
    if(undoStack.length<=1) return;

    redoStack.push(undoStack.pop());
    restoreState(undoStack[undoStack.length-1]);
};

redoBtn.onclick=()=>{
    if(!redoStack.length) return;

    const state=redoStack.pop();
    undoStack.push(state);
    restoreState(state);
};

clearBtn.onclick=()=>{
    saveState();
    ctx.fillStyle="white";
    ctx.fillRect(0,0,canvas.width,canvas.height);
};

saveGalleryBtn.onclick=()=>{
    const name=prompt("Drawing name","My Drawing");
    if(name===null) return;

    const gallery=getGallery();

    gallery.push({
        name:name||"My Drawing",
        image:canvas.toDataURL("image/png")
    });

    saveGalleryData(gallery);
};

saveBtn.onclick=()=>{
    let fileName=prompt("Enter a file name","drawing");

    if(fileName===null) return;

    fileName=fileName.trim()||"drawing";

    const link=document.createElement("a");
    link.download=fileName+".png";
    link.href=canvas.toDataURL("image/png");
    link.click();
};
</script>

</body>
</html>
