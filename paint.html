<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paint</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#toolbar {
    height: 50px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    background: #ececec;
    border-bottom: 1px solid #bbb;
    flex-wrap: wrap;
}

button {
    padding: 6px 12px;
    cursor: pointer;
}

.active {
    background: #bcdcff;
}

canvas {
    display: block;
    background: white;
    cursor: crosshair;
    touch-action: none;
}
</style>
</head>
<body>

<div id="toolbar">
    <button id="pencilBtn" class="active">Pencil</button>
    <button id="eraserBtn">Eraser</button>
    <button id="fillBtn">Fill</button>

    <button id="rectStampBtn">Rectangle</button>
    <button id="circleStampBtn">Circle</button>
    <button id="triangleStampBtn">Triangle</button>

    <input type="color" id="color" value="#000000">

    <label>Size:</label>
    <input type="range" id="size" min="1" max="50" value="3">

    <button id="clearBtn">Clear</button>
    <button id="saveBtn">Save PNG</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const toolbar = document.getElementById("toolbar");
const colorInput = document.getElementById("color");
const sizeInput = document.getElementById("size");

let drawing = false;
let tool = "pencil";

function resizeCanvas() {
    const image = document.createElement("canvas");
    image.width = canvas.width;
    image.height = canvas.height;

    const imageCtx = image.getContext("2d");
    imageCtx.drawImage(canvas, 0, 0);

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - toolbar.offsetHeight;

    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.drawImage(image, 0, 0);
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

function setTool(newTool, activeButton) {
    tool = newTool;

    document.querySelectorAll("#toolbar button").forEach(btn => {
        btn.classList.remove("active");
    });

    activeButton.classList.add("active");
}

document.getElementById("pencilBtn").addEventListener("click", () => {
    setTool("pencil", document.getElementById("pencilBtn"));
});

document.getElementById("eraserBtn").addEventListener("click", () => {
    setTool("eraser", document.getElementById("eraserBtn"));
});

document.getElementById("fillBtn").addEventListener("click", () => {
    setTool("fill", document.getElementById("fillBtn"));
});

document.getElementById("rectStampBtn").addEventListener("click", () => {
    setTool("rectangle", document.getElementById("rectStampBtn"));
});

document.getElementById("circleStampBtn").addEventListener("click", () => {
    setTool("circle", document.getElementById("circleStampBtn"));
});

document.getElementById("triangleStampBtn").addEventListener("click", () => {
    setTool("triangle", document.getElementById("triangleStampBtn"));
});

function getMousePos(event) {
    const rect = canvas.getBoundingClientRect();

    return {
        x: Math.floor(event.clientX - rect.left),
        y: Math.floor(event.clientY - rect.top)
    };
}

function hexToRgb(hex) {
    return {
        r: parseInt(hex.slice(1, 3), 16),
        g: parseInt(hex.slice(3, 5), 16),
        b: parseInt(hex.slice(5, 7), 16)
    };
}

function floodFill(startX, startY, fillColor) {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;

    const startPos = (startY * canvas.width + startX) * 4;

    const targetR = data[startPos];
    const targetG = data[startPos + 1];
    const targetB = data[startPos + 2];
    const targetA = data[startPos + 3];

    if (
        targetR === fillColor.r &&
        targetG === fillColor.g &&
        targetB === fillColor.b
    ) {
        return;
    }

    const stack = [[startX, startY]];

    while (stack.length) {
        const [x, y] = stack.pop();

        if (
            x < 0 ||
            y < 0 ||
            x >= canvas.width ||
            y >= canvas.height
        ) {
            continue;
        }

        const pos = (y * canvas.width + x) * 4;

        if (
            data[pos] !== targetR ||
            data[pos + 1] !== targetG ||
            data[pos + 2] !== targetB ||
            data[pos + 3] !== targetA
        ) {
            continue;
        }

        data[pos] = fillColor.r;
        data[pos + 1] = fillColor.g;
        data[pos + 2] = fillColor.b;
        data[pos + 3] = 255;

        stack.push([x + 1, y]);
        stack.push([x - 1, y]);
        stack.push([x, y + 1]);
        stack.push([x, y - 1]);
    }

    ctx.putImageData(imageData, 0, 0);
}

canvas.addEventListener("pointerdown", (event) => {
    const pos = getMousePos(event);
    const shapeSize = parseInt(sizeInput.value) * 10;

    if (tool === "fill") {
        floodFill(
            pos.x,
            pos.y,
            hexToRgb(colorInput.value)
        );
        return;
    }

    if (tool === "rectangle") {
        ctx.fillStyle = colorInput.value;
        ctx.fillRect(
            pos.x - shapeSize / 2,
            pos.y - shapeSize / 2,
            shapeSize,
            shapeSize
        );
        return;
    }

    if (tool === "circle") {
        ctx.fillStyle = colorInput.value;
        ctx.beginPath();
        ctx.arc(
            pos.x,
            pos.y,
            shapeSize / 2,
            0,
            Math.PI * 2
        );
        ctx.fill();
        return;
    }

    if (tool === "triangle") {
        ctx.fillStyle = colorInput.value;

        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y - shapeSize / 2);
        ctx.lineTo(pos.x - shapeSize / 2, pos.y + shapeSize / 2);
        ctx.lineTo(pos.x + shapeSize / 2, pos.y + shapeSize / 2);
        ctx.closePath();
        ctx.fill();
        return;
    }

    drawing = true;

    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);

    canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener("pointermove", (event) => {
    if (!drawing) return;

    const pos = getMousePos(event);

    ctx.lineWidth = parseInt(sizeInput.value);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    if (tool === "eraser") {
        ctx.strokeStyle = "#FFFFFF";
    } else {
        ctx.strokeStyle = colorInput.value;
    }

    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
});

canvas.addEventListener("pointerup", () => {
    drawing = false;
});

canvas.addEventListener("pointercancel", () => {
    drawing = false;
});

canvas.addEventListener("pointerleave", () => {
    drawing = false;
});

document.getElementById("clearBtn").addEventListener("click", () => {
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
});

document.getElementById("saveBtn").addEventListener("click", () => {
    let fileName = prompt("Enter a file name:", "drawing");

    if (fileName === null) return;

    fileName = fileName.trim();

    if (fileName === "") {
        fileName = "drawing";
    }

    const link = document.createElement("a");
    link.download = fileName + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
});
</script>

</body>
</html>
